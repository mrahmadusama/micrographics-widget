plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ahmad.micrographics'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ahmad.micrographics'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideload-only app: sign release builds with the local debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
